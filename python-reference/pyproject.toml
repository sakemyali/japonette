[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ft-cli"
version = "0.1.0"
description = "A small CLI for the 42 API: browse active people at a campus and keep a local friends watchlist."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mvrm" }]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "tomli_w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
"42" = "ft_cli.cli:app"
"ft" = "ft_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
